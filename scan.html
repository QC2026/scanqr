<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PT URIP SUGIARTO</title>
<script src="html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#ffd700;font-family:sans-serif;padding:12px}
.header{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #c9a84c;border-radius:12px;padding:10px}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{background:#111;border:2px solid #c9a84c;border-radius:12px;padding:12px;margin-top:12px}
.step{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;border:1px solid #444}
.active{background:gold;color:black}.done{background:#0f0;color:black}.wait{background:#222;color:#888}
#reader{width:100%;min-height:65vh;border-radius:12px;overflow:hidden;background:#000;margin-top:12px;position:relative}
#reader video{width:100%!important;object-fit:cover!important}
#scan-guide{border:4px solid #ffeb00;box-shadow:0 0 0 4000px rgba(0,0,0,0.45);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;max-width:85vw;max-height:85vw;border-radius:12px;z-index:5;pointer-events:none}
#scan-guide::before{content:'ARAHKAN QR KESINI';position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:#ffeb00;color:#000;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;box-sizing:border-box;margin-top:8px}
#resultBox,#verify8Box{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;padding:20px;box-sizing:border-box;overflow:auto}
.card{background:#1a1a1a;border:3px solid gold;border-radius:16px;padding:20px;text-align:center;margin-top:10%}
#list-preview{background:#000;border:1.5px solid #0f0;border-radius:8px;padding:8px;margin-top:8px;max-height:180px;overflow:auto;text-align:left;font-size:13px;color:#0f0}
html,body{width:100%;overflow-x:hidden}
</style>
</head>
<body>
<div class="header"><div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIP SUGIARTO</div></div>

<div class="box">
<div style="font-weight:900;color:#ffdf8a" id="tipe">SCAN</div>
<div id="steps" style="margin-top:8px"></div>
<div id="step-info" style="text-align:center;margin-top:8px;font-weight:900;color:gold">Siap Scan</div>
<div id="reader"><div id="scan-guide"></div></div>
<div id="list-preview"><div style="color:#888">Belum ada QR BAK - Scan 8x</div></div>
<button onclick="paksaFokus()" class="btn" style="background:#2563eb;color:white">🔍 TAP JIKA BLUR</button>
<div style="display:flex;gap:6px">
<button onclick="setZoom(1)" class="btn" style="background:#333;color:white;flex:1">1x</button>
<button onclick="setZoom(2.5)" class="btn" style="background:gold;color:black;flex:1">2.5x</button>
<button onclick="toggleTorch()" class="btn" style="background:#333;color:white;flex:1">🔦</button>
<button onclick="gantiKamera()" class="btn" style="background:#0d2a54;color:white;flex:1;border:2px solid #2a5aa8">🔄</button>
</div>
<input id="manual" placeholder="Ketik manual jika QR rusak" autocomplete="off" autocapitalize="characters" spellcheck="false">
<button onclick="inputManual()" class="btn" style="background:#333;color:white">INPUT MANUAL</button>
<div id="status" style="text-align:center;margin-top:10px;color:#0f0;font-weight:900"></div>
<div id="bdlCounter" style="display:none;text-align:center;margin-top:8px;background:#ffeb00;color:#000;font-weight:900;padding:8px;border-radius:8px"></div>
<button onclick="resetScan()" class="btn" style="background:#222;color:white">🔄 ULANG SEMUA</button>
</div>
<button onclick="location.href='index.html'" class="btn" style="background:#b91c1c;color:white;border:2px solid gold">⬅ KEMBALI KEHALAMAN 1</button>
<div id="resultBox"><div class="card"><div id="resStep" style="color:gold;font-weight:900;font-size:14px"></div><h2 style="color:white;margin:8px 0">Hasil Scan:</h2><h1 id="resValue" style="color:#0f0;word-break:break-all;font-size:22px;background:#000;padding:14px;border-radius:8px;border:1px solid #444"></h1><div id="extraInfo" style="color:#ffeb00;margin-top:10px;font-weight:700"></div><div style="display:flex;gap:10px;margin-top:18px"><button onclick="confirmScan()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI</button><button onclick="ulangCurrent()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG</button></div></div></div>
<div id="verify8Box"><div class="card" style="border-color:#0f0"><h2 style="color:#0f0">✅ 8 QR TERKUMPUL</h2><div id="list8Preview" style="background:#000;border:1px solid #444;border-radius:8px;padding:8px;max-height:260px;overflow:auto;text-align:left;font-size:13px;color:#0f0;margin-top:10px"></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="confirm8()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI LANJUT</button><button onclick="ulang8()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG 8 QR</button></div></div></div>
<script>
// FIX HALAMAN 1 : kalo dibuka langsung tanpa pilih menu, balik ke index.html
if(!localStorage.getItem('scan_type')){
  // cek kalo file index.html ada, langsung balik biar halaman 1 muncul
  if(location.pathname.indexOf('scan')>-1){
    document.getElementById('status').innerText='⚠️ Pilih menu di halaman 1 dulu...';
    setTimeout(()=>{ location.href='index.html'; }, 800);
  }
}
 <script>
// FIX TGL JAM - WIB 100% AKURAT
function getWIBDateTime(){
  const now=new Date();
  return {
    tgl_en: now.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}), // 2026-11-04 buat sheet
    tgl_id: now.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'}), // 04/11/2026 buat display
    jam: now.toLocaleTimeString('en-GB',{timeZone:'Asia/Jakarta',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}), // 14:23:15
    full_display: now.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'}) + ' ' + now.toLocaleTimeString('en-GB',{timeZone:'Asia/Jakarta',hour12:false}) + ' WIB',
    full_sheet: now.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}) + ' ' + now.toLocaleTimeString('en-GB',{timeZone:'Asia/Jakarta',hour12:false}) // INI YANG MASUK SHEET
  };
}
function hitungBDL(idBdl){ 
  if(!idBdl) return 0;
  try{
    let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
    let todayID = new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'});
    let todayEN = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
    return all.filter(d=>{ let waktu=(d.waktu||'')+' '+(d.TGL_CLIENT||'')+' '+(d.TANGGAL||''); return (waktu.includes(todayID)||waktu.includes(todayEN)) && (d.ID_BDL||'').toUpperCase()==idBdl.toUpperCase(); }).length;
  }catch(e){return 0;}
}
let lastScan=""; let lastTime=0;
function cegahDoubleScan(value){ let now=Date.now(); if(value===lastScan && (now-lastTime)<3000) return "Sabar, ojo di scan dobel! Tunggu 3 detik"; lastScan=value; lastTime=now; return ""; } 
function validatePager(value, step){
  if(!value || !step) return "STEP/VALUE KOSONG!";
  value = value.trim().toUpperCase();
  step = step.toString().toUpperCase().replace(/[\s_-]/g, "");

  try{ 
    if(typeof cegahDoubleScan === "function"){
      let dobel = cegahDoubleScan(value);
      if(dobel) return dobel;
    }
  }catch(e){}

  // === MODE BAK FINAL: G1-001 + BAK-1234 ===
  // Harus gelem nembak G1-001 karo BAK-1234, wegah nek 123456
  if(step.includes('BAK') || step === 'QR' || step.includes('QRBAK')){
    
    // 1. TOLAK angka tok koyo 123456 - KAMERA WEGAH
    if(/^\d+$/.test(value)){
      return "SALAH! INI BUKAN QR BAK ! KAMERA EMOH!";
    }
    if(/^\d{5,6}$/.test(value)){
      return "SALAH! INI NO ID ANGKA TOK, DITOLAK!";
    }

    // 2. LOLOS nek format anyar BAK-1234
    if(/^BAK-\d+$/.test(value)){
      return ""; // LOLOS
    }

    // 3. LOLOS nek format ID G1-001, G11-001, G6-858
    if(/^G\d+-\d+$/.test(value)){
      return ""; // LOLOS
    }
    
    // 4. WAJIB ada -
    if(!value.includes('-')){
      return "SALAH! HARUS G1-001 ATAU BAK-1234 (HARUS ADA -)!";
    }

    // 5. Minimal 4 karakter
    if(value.length < 4){
      return "SALAH! KEPENDEKAN!";
    }
    
    // Format Gxxx-xxx liyane yo lolos
    if(/^[A-Z]+\d*-\d+$/.test(value)){
      return "";
    }

    return "SALAH! FORMAT HARUS G1-001 ATAU BAK-1234!";
  }

  // === SCAN ID (tetep) ===
  if(step.includes('IDPC') || step.includes('IDGL') || step.includes('IDKMS') || step.includes('IDPACK') || step.includes('IDBDL') || step.includes('IDBALL')){
    if(value.includes('-') || value.includes('BAK')){
      return "SALAH! INI QR BAK, BUKAN ID!";
    }
    if(/[A-Z]/.test(value)){
      return "SALAH! INI QR BAK, BUKAN ID!";
    }
    if(!/^\d{5,6}$/.test(value)){
      return "SALAH! ID HARUS 5-6 ANGKA!";
    }
    return "";
  }

  if(typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(80);
  return "";
}
const GOOGLE_URL="https://script.google.com/macros/s/AKfycbyh3iNQV_kjmj5Xougv71g7gxf9K16OMxdhsVVhifOXcR5PRKSP670k3Bq--Oz05UF7Sw/exec";
const TYPE=(localStorage.getItem('scan_type')||'BALL').toUpperCase();
document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],'KMS':['QR CODE BAK','ID KMS'],'PACK':['QR CODE BAK','ID PACK'],'BDL':['QR CODE BAK','ID BDL'],'BALL':['QR CODE BAK','ID BALL','NO BOX']};
let flow=FLOWS[TYPE]||FLOWS['BALL']; let cur=0; let res={}; let listBak=[]; let html5QrcodeScanner; let lastScanTime=0; let isPause=false; let tempScan=""; let torchOn=false;
function renderSteps(){
 let h=''; if(TYPE=='BALL'){ if(cur==0) h+=`<span class="step active">▶ QR BAK [${listBak.length}/8]</span>`; else h+=`<span class="step done">✓ QR BAK [8/8]</span>`; flow.slice(1).forEach((s,i)=>{let stepIdx=i+1;let cls=stepIdx<cur?'done':stepIdx==cur?'active':'wait';h+=`<span class="step ${cls}">${stepIdx<cur?'✓ ':stepIdx==cur?'▶ ':''}${s}</span>`;}); document.getElementById('step-info').innerText = cur==0 ? `Siap Scan [${listBak.length}/8]` : flow[cur]; document.getElementById('list-preview').style.display='block'; } else { flow.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'wait';h+=`<span class="step ${cls}">${i<cur?'✓ ':i==cur?'▶ ':''}${s}</span>`;}); document.getElementById('step-info').innerText = flow[cur] || 'Siap Scan'; document.getElementById('list-preview').style.display='none'; } document.getElementById('steps').innerHTML=h;
}
async function KIRIM_RIWAYAT_PAGI(){ /* ... tetep sama, udah bener ... */ }
function onScanSuccess(decoded){
 if(isPause) return; const now=Date.now(); if(now-lastScanTime<800) return; lastScanTime=now; decoded=decoded.trim().toUpperCase();
 let stepSaiki=(typeof flow!=='undefined'&&flow[cur])?flow[cur]:TYPE; let cekError=validatePager(decoded,stepSaiki); if(cekError){ document.getElementById('status').innerText='⛔ '+cekError; if(navigator.vibrate) navigator.vibrate([100,50,100,100]); return; }
 if(TYPE=='BALL'&&cur==0){ if(listBak.includes(decoded)){document.getElementById('status').innerText='⚠️ QR udah ada!'; return;} listBak.push(decoded); document.getElementById('list-preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join(''); renderSteps(); document.getElementById('status').innerText=`✅ Masuk ${listBak.length}/8`; if(listBak.length<8) return; document.getElementById('list8Preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join(''); document.getElementById('verify8Box').style.display='block'; isPause=true; try{html5QrcodeScanner.pause(true);}catch(e){} return; }
 isPause=true; tempScan=decoded; try{html5QrcodeScanner.pause(true);}catch(e){} document.getElementById('resStep').innerText=flow[cur]; document.getElementById('resValue').innerText=decoded; document.getElementById('extraInfo').innerText=''; if(TYPE=='BDL'&&flow[cur]=='ID BDL'){ let c=hitungBDL(decoded)+1; document.getElementById('extraInfo').innerText=`🔢 ID BDL ini sudah scan ${c}x`; document.getElementById('bdlCounter').style.display='block'; document.getElementById('bdlCounter').innerText=`🔢 BDL ${decoded} = ${c}x hari ini`; } document.getElementById('resultBox').style.display='block';
}
function confirm8(){ document.getElementById('verify8Box').style.display='none'; cur=1; renderSteps(); document.getElementById('status').innerText='8 BAK OK! Scan ID BALL'; isPause=false; try{html5QrcodeScanner.resume();}catch(e){} }
function ulang8(){ document.getElementById('verify8Box').style.display='none'; listBak=[]; document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya </div>'; renderSteps(); document.getElementById('status').innerText='🔄 Ulang 8 QR ya'; isPause=false; try{html5QrcodeScanner.resume();}catch(e){} }
function confirmScan(){document.getElementById('resultBox').style.display='none';res[flow[cur]]=tempScan;cur++;renderSteps();if(cur>=flow.length){autoSave();}else{isPause=false;try{html5QrcodeScanner.resume();}catch(e){}lastScanTime=Date.now();}}
function ulangCurrent(){document.getElementById('resultBox').style.display='none';isPause=false;tempScan="";lastScanTime=0;try{html5QrcodeScanner.resume();}catch(e){}}
function inputManual(){ let el=document.getElementById('manual'); let v=el.value.trim(); if(!v){ el.focus(); document.getElementById('status').innerText='⚠️ Ketik QR dulu'; return; } v=v.toUpperCase(); el.value=''; onScanSuccess(v); }
function resetScan(){cur=0;res={};listBak=[];lastScanTime=0;isPause=false;tempScan="";document.getElementById('resultBox').style.display='none';document.getElementById('verify8Box').style.display='none';document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';document.getElementById('bdlCounter').style.display='none';renderSteps();try{html5QrcodeScanner.resume();}catch(e){}}
async function startCam(){
  html5QrcodeScanner=new Html5Qrcode("reader");
  const config={fps:15,qrbox:{width:320,height:320},aspectRatio:1.7778,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:false},videoConstraints:{facingMode:"environment"}};
  try{await html5QrcodeScanner.start({facingMode:{exact:"environment"}},config,onScanSuccess,()=>{});setTimeout(()=>setZoom(2.5),800);return;}catch(e1){
    try{await html5QrcodeScanner.start({facingMode:"environment"},config,onScanSuccess,()=>{});return;}catch(e2){
      try{let cams=await Html5Qrcode.getCameras();if(!cams.length) throw e2; let back=cams[cams.length-1];let found=cams.find(c=>/back|rear|environment/i.test(c.label));if(found) back=found;await html5QrcodeScanner.start(back.id,config,onScanSuccess,()=>{});}catch(e3){document.getElementById('status').innerText="❌ Kamera diblokir";}}}
}
function setZoom(z){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.zoom){const want=Math.min(z,cap.zoom.max);track.applyConstraints({advanced:[{zoom:want}]});}}catch(e){}}
function paksaFokus(){try{const track=html5QrcodeScanner.getRunningTrack();track.applyConstraints({advanced:[{focusMode:"continuous"}]});}catch{html5QrcodeScanner.stop().then(()=>startCam());}}
function toggleTorch(){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.torch){torchOn=!torchOn;track.applyConstraints({advanced:[{torch:torchOn}]});}}catch(e){}}
async function gantiKamera(){try{await html5QrcodeScanner.stop();}catch{}startCam();}
async function autoSave(){
  if(html5QrcodeScanner){try{await html5QrcodeScanner.stop();}catch(e){}}
  let bagian=localStorage.getItem('bagian')||TYPE;
  const wib=getWIBDateTime(); 
  let tgl_input=wib.tgl_en; 
  let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
  if(TYPE=='BALL'){
    listBak.forEach(qr=>{if(!qr) return;let idx=all.findIndex(d=>d.QR_BAK==qr);if(idx==-1){all.push({QR_BAK:qr,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,waktu:wib.full_display,TGL_JAM_CLIENT:wib.full_sheet,status:'Lokal'});}else{all[idx].ID_BALL=res['ID BALL']||'';all[idx].NO_BOX=res['NO BOX']||'';}});
    localStorage.setItem('riwayat',JSON.stringify(all)); localStorage.setItem('riwayat_scan',JSON.stringify(all));
    let kirim={TYPE:'BALL_8',LIST_BAK:listBak,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TGL_KMS:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,TGL_JAM_CLIENT:wib.full_sheet};
    document.getElementById('status').innerText="⏳ KIRIM 8 BAK..."; 
    try{await fetch(GOOGLE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(kirim)});document.getElementById('status').innerText="✅ 8 BAK TERKIRIM "+wib.full_display;}catch(e){document.getElementById('status').innerText="⚠️ OFFLINE - RIWAYAT AMAN";}
    setTimeout(()=>{alert('✅ Tersimpan 8 BAK! BALL: '+res['ID BALL']+'\nJam: '+wib.full_display);location.href='index.html';},800); return;
  }
  let qr=res['QR CODE BAK']||''; let idx=all.findIndex(d=>d.QR_BAK==qr&&!d.ID_BALL); if(idx==-1){all.push({QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:TYPE=='KMS'?res['ID KMS']||'':'',ID_PACK:TYPE=='PACK'?res['ID PACK']||'':'',ID_BDL:TYPE=='BDL'?res['ID BDL']||'':'',BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,waktu:wib.full_display,TGL_JAM_CLIENT:wib.full_sheet,status:'Lokal'});}
  localStorage.setItem('riwayat',JSON.stringify(all)); localStorage.setItem('riwayat_scan',JSON.stringify(all));
  let kirim={QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:res['ID KMS']||'',ID_PACK:res['ID PACK']||'',ID_BDL:res['ID BDL']||'',BAGIAN:bagian,TGL_KMS:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,TGL_JAM_CLIENT:wib.full_sheet,TYPE:TYPE};
  document.getElementById('status').innerText="⏳ KIRIM... "+wib.full_display;
  try{await fetch(GOOGLE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(kirim)});document.getElementById('status').innerText="✅ TERKIRIM "+wib.full_display;}catch(e){document.getElementById('status').innerText="⚠️ OFFLINE - RIWAYAT AMAN "+wib.full_display;}
  setTimeout(()=>{alert('✅ Tersimpan! '+TYPE+' - '+qr+'\nJam: '+wib.full_display);location.href='index.html';},800);
}
renderSteps();startCam();
</script>
</body>
</html>
