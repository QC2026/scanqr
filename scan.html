<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PT URIP SUGIARTO</title>
<script src="html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#ffd700;font-family:sans-serif;padding:12px}
.header{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #c9a84c;border-radius:12px;padding:10px}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{background:#111;border:2px solid #c9a84c;border-radius:12px;padding:12px;margin-top:12px}
.step{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;border:1px solid #444}
.active{background:gold;color:black}.done{background:#0f0;color:black}.wait{background:#222;color:#888}
#reader{width:100%;min-height:65vh;border-radius:12px;overflow:hidden;background:#000;margin-top:12px;position:relative}
#reader video{width:100%!important;object-fit:cover!important}
#scan-guide{border:4px solid #ffeb00;box-shadow:0 0 0 4000px rgba(0,0,0,0.45);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;max-width:85vw;max-height:85vw;border-radius:12px;z-index:5;pointer-events:none}
#scan-guide::before{content:'ARAHKAN QR KESINI';position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:#ffeb00;color:#000;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;box-sizing:border-box;margin-top:8px}
#resultBox,#verify8Box{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;padding:20px;box-sizing:border-box;overflow:auto}
.card{background:#1a1a1a;border:3px solid gold;border-radius:16px;padding:20px;text-align:center;margin-top:10%}
#list-preview{background:#000;border:1.5px solid #0f0;border-radius:8px;padding:8px;margin-top:8px;max-height:180px;overflow:auto;text-align:left;font-size:13px;color:#0f0}
html,body{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
</style>
</head><body>
<div class="header"><div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIP SUGIARTO</div></div>
<div class="box">
<div style="font-weight:900;color:#ffdf8a" id="tipe">SCAN</div>
<div id="steps" style="margin-top:8px"></div>
<div id="step-info" style="text-align:center;margin-top:8px;font-weight:900;color:gold">Siap Scan [0/8]</div>
<div id="reader"><div id="scan-guide"></div></div>
<div id="list-preview"><div style="color:#888">Belum ada QR BAK - Scan 8x </div></div>
<button onclick="paksaFokus()" class="btn" style="background:#2563eb;color:white">🔍 TAP JIKA BLUR</button>
<div style="display:flex;gap:6px">
<button onclick="setZoom(1)" class="btn" style="background:#333;color:white;flex:1">1x</button>
<button onclick="setZoom(2.5)" class="btn" style="background:gold;color:black;flex:1">2.5x</button>
<button onclick="toggleTorch()" class="btn" style="background:#333;color:white;flex:1">🔦</button>
<button onclick="gantiKamera()" class="btn" style="background:#0d2a54;color:white;flex:1;border:2px solid #2a5aa8">🔄</button>
</div>
<input id="manual" placeholder="Ketik manual jika QR rusak">
<button onclick="inputManual()" class="btn" style="background:#333;color:white">INPUT MANUAL</button>
<div id="status" style="text-align:center;margin-top:10px;color:#0f0;font-weight:900"></div>
<div id="bdlCounter" style="display:none;text-align:center;margin-top:8px;background:#ffeb00;color:#000;font-weight:900;padding:8px;border-radius:8px"></div>
<button onclick="resetScan()" class="btn" style="background:#222;color:white">🔄 ULANG SEMUA</button>
</div>
<button onclick="location.href='index.html'" class="btn" style="background:#b91c1c;color:white;border:2px solid gold">⬅ KEMBALI KE HALAMAN 1</button>
<div id="riwayatBox" style="margin:20px; background:#f5f5f5; padding:10px; border-radius:8px; display:none;">
  <h3 style="margin:0 0 10px 0;">📋 Riwayat Scan HP</h3>
  <div id="listRiwayat"></div>
  <button onclick="if(confirm('Hapus semua riwayat HP?')){localStorage.removeItem('riwayatScan');renderRiwayat();}" style="margin-top:10px; background:#ff4444; color:white; border:none; padding:8px 12px; border-radius:5px;">🗑️ HAPUS RIWAYAT HP</button>
</div>
<div id="resultBox"><div class="card"><div id="resStep" style="color:gold;font-weight:900;font-size:14px"></div><h2 style="color:white;margin:8px 0">Hasil Scan:</h2><h1 id="resValue" style="color:#0f0;word-break:break-all;font-size:22px;background:#000;padding:14px;border-radius:8px;border:1px solid #444"></h1><div id="extraInfo" style="color:#ffeb00;margin-top:10px;font-weight:700"></div><div style="display:flex;gap:10px;margin-top:18px"><button onclick="confirmScan()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI</button><button onclick="ulangCurrent()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG</button></div></div></div>

<div id="verify8Box"><div class="card" style="border-color:#0f0"><h2 style="color:#0f0">✅ 8 QR TERKUMPUL</h2><div style="color:white;font-size:12px;margin:6px 0">Cek dulu , 8 QR ini sudah SESUAI 1 BALL?</div><div id="list8Preview" style="background:#000;border:1px solid #444;border-radius:8px;padding:8px;max-height:260px;overflow:auto;text-align:left;font-size:13px;color:#0f0;margin-top:10px"></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="confirm8()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI LANJUT</button><button onclick="ulang8()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG 8 QR</button></div></div></div>

<script>
// FIX HALAMAN 1 : kalo dibuka langsung tanpa pilih menu, balik ke index.html
if(!localStorage.getItem('scan_type')){
  // cek kalo file index.html ada, langsung balik biar halaman 1 muncul
  if(location.pathname.indexOf('scan')>-1){
    document.getElementById('status').innerText='⚠️ Pilih menu di halaman 1 dulu...';
    setTimeout(()=>{ location.href='index.html'; }, 800);
  }
}
const TYPE=(localStorage.getItem('scan_type')||'BALL').toUpperCase();
document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],'KMS':['QR CODE BAK','ID KMS'],'PACK':['QR CODE BAK','ID PACK'],'BDL':['QR CODE BAK','ID BDL'],'BALL':['QR CODE BAK','ID BALL','NO BOX']};
let flow=FLOWS[TYPE]||FLOWS['BALL']; let cur=0; let res={}; let listBak=[]; let html5QrcodeScanner; let lastScanTime=0; let isPause=false; let tempScan=""; let torchOn=false;

function renderSteps(){
 let h='';
 if(TYPE=='BALL'){
   if(cur==0) h+=`<span class="step active">▶ QR BAK [${listBak.length}/8]</span>`;
   else h+=`<span class="step done">✓ QR BAK [8/8]</span>`;
   flow.slice(1).forEach((s,i)=>{let stepIdx=i+1;let cls=stepIdx<cur?'done':stepIdx==cur?'active':'wait';h+=`<span class="step ${cls}">${stepIdx<cur?'✓ ':stepIdx==cur?'▶ ':''}${s}</span>`;});
 } else { flow.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'wait';h+=`<span class="step ${cls}">${i<cur?'✓ ':i==cur?'▶ ':''}${s}</span>`;}); }
 document.getElementById('steps').innerHTML=h;
}
function getWIBDateTime(){
  const now=new Date();
  const tgl_client=now.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
  const tgl_client_id=now.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'});
  const jam_client=now.toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour12:false});
  const full_client=tgl_client_id+' '+jam_client;
  return{tgl_client,tgl_client_id,jam_client,full_client,raw:now};
}
function hitungBDL(idBdl){
  if(!idBdl) return 1;
  try{
    let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
    let today = new Date().toDateString();
    let filtered = all.filter(d=>{
      try{
        let tglData = d.WIB ? new Date(d.WIB).toDateString() : '';
        return (d.ID_BDL||'').toUpperCase()==idBdl.toUpperCase() && tglData==today;
      }catch(e){return false;}
    });
    return filtered.length + 1;
  }catch(e){return 1;}
}
// PAGER ANTI SALAH V2 - SUPPORT BAK-0001 & G1-001
function validatePager(value,step){
  step=step.toUpperCase();
  value=value.trim().toUpperCase();
  
  // LAPIS 1: QR BAK -> BAK-0001 ATAU G1-001 (ADA TANDA -)
  if(step.includes('QR CODE BAK')||step.includes('QR BAK')){
    if(!/^[A-Z0-9]+-[A-Z0-9-]+$/i.test(value)) return "SALAH! INI BUKAN QR BAK! HARUSNYA BAK-0001 ATAU G1-001";
    if(/^\d+$/.test(value)) return "SALAH! INI ID ANGKA, BUKAN QR BAK!";
    if(value.length < 5) return "SALAH! QR BAK KEPENDEKAN!";
  }
  
  // LAPIS 2: ID (HARUS ANGKA MURNI)
  if(step.includes('ID PC')||step.includes('ID GL')||step.includes('ID KMS')||step.includes('ID PACK')||step.includes('ID BDL')||step.includes('ID BALL')){
    if(value.includes('-')) return "SALAH! INI QR BAK (BAK-0001/G1-001), BUKAN ID! SCAN ID ANGKA 5-6 DIGIT!";
    if(!/^\d{5,6}$/.test(value)) return "SALAH! ID HARUS 5 ATAU 6 ANGKA! CONTOH: 12345";
  }
  
  // LAPIS 3: NO BOX
  if(step.includes('NO BOX')||step.includes('BOX')){
    if(value.includes('BAK-') || /^[A-Z][0-9]+-/.test(value)) return "SALAH! INI QR BAK, BUKAN NO BOX!";
  }
  
  return "";
}
function onScanSuccess(decoded){
 if(isPause) return;
 const now=Date.now(); if(now-lastScanTime<800) return; lastScanTime=now;
 decoded = decoded.trim().toUpperCase();
 if(TYPE=='BALL' && cur==0){
   if(listBak.includes(decoded)){document.getElementById('status').innerText='⚠️ QR udah ada!'; if(navigator.vibrate) navigator.vibrate([100,50,100]); return;}
   listBak.push(decoded);
   document.getElementById('step-info').innerText = 'Siap Scan [0/8]';
   document.getElementById('list-preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');
   renderSteps(); if(navigator.vibrate) navigator.vibrate([80]);
   document.getElementById('status').innerText=`✅ Masuk ${listBak.length}/8`;
   if(listBak.length < 8) return;
   document.getElementById('list8Preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');
   document.getElementById('verify8Box').style.display='block';
   isPause=true; try{html5QrcodeScanner.pause(true);}catch(e){}
   return;
 }
 isPause=true; tempScan=decoded; try{html5QrcodeScanner.pause(true);}catch(e){}
 document.getElementById('resStep').innerText=flow[cur];
 document.getElementById('resValue').innerText=decoded;
 document.getElementById('extraInfo').innerText='';
 if(TYPE=='BDL' && flow[cur]=='ID BDL'){
   let c=hitungBDL(decoded)+1;
   document.getElementById('extraInfo').innerText=`🔢 ID BDL ini sudah scan ${c}x (termasuk yang ini)`;
   document.getElementById('bdlCounter').style.display='block';
   document.getElementById('bdlCounter').innerText=`🔢 BDL ${decoded} = ${c}x scan hari ini`;
 }
 document.getElementById('resultBox').style.display='block'; if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function confirm8(){
  document.getElementById('verify8Box').style.display='none';
  cur=1; renderSteps(); document.getElementById('step-info').innerText='Lanjut scan ID BALL'; document.getElementById('status').innerText='8 BAK OK! Scan ID BALL'; if(navigator.vibrate) navigator.vibrate([200,100,200]);
  isPause=false; try{html5QrcodeScanner.resume();}catch(e){} lastScanTime=Date.now();
}
function ulang8(){
  document.getElementById('verify8Box').style.display='none';
  listBak=[]; document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya </div>'; document.getElementById('step-info').innerText='Siap Scan [0/8]'; renderSteps(); document.getElementById('status').innerText='🔄 Ulang 8 QR ya';
  isPause=false; try{html5QrcodeScanner.resume();}catch(e){}
}
function confirmScan(){document.getElementById('resultBox').style.display='none';res[flow[cur]]=tempScan;cur++;renderSteps();if(cur>=flow.length){autoSave();}else{isPause=false;try{html5QrcodeScanner.resume();}catch(e){}document.getElementById('step-info').innerText=flow[cur];lastScanTime=Date.now();}}
function ulangCurrent(){document.getElementById('resultBox').style.display='none';isPause=false;tempScan="";lastScanTime=0;try{html5QrcodeScanner.resume();}catch(e){}}
function inputManual(){let v=document.getElementById('manual').value.trim().toUpperCase();if(!v) return alert('Isi dulu');onScanSuccess(v);document.getElementById('manual').value='';}
function resetScan(){cur=0;res={};listBak=[];lastScanTime=0;isPause=false;tempScan="";document.getElementById('resultBox').style.display='none';document.getElementById('verify8Box').style.display='none';document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';document.getElementById('step-info').innerText = TYPE=='BALL' ? 'Siap Scan [0/8]' : 'Siap Scan';document.getElementById('bdlCounter').style.display='none';renderSteps();try{html5QrcodeScanner.resume();}catch(e){}}
async function startCam(){
  html5QrcodeScanner=new Html5Qrcode("reader");
  const config={fps:15,qrbox:{width:280,height:280},aspectRatio:1.7778,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:false},videoConstraints:{facingMode:"environment"}};
  try{await html5QrcodeScanner.start({facingMode:{exact:"environment"}},config,onScanSuccess,()=>{});setTimeout(()=>setZoom(2.5),800);return;}catch(e1){
    try{await html5QrcodeScanner.start({facingMode:"environment"},config,onScanSuccess,()=>{});setTimeout(()=>setZoom(2.5),800);return;}catch(e2){
      try{let cams=await Html5Qrcode.getCameras();if(!cams.length) throw e2; let back=cams[cams.length-1];let found=cams.find(c=>/back|rear|environment/i.test(c.label));if(found) back=found;await html5QrcodeScanner.start(back.id,config,onScanSuccess,()=>{});setTimeout(()=>setZoom(2.5),800);}catch(e3){document.getElementById('status').innerText="❌ Kamera diblokir - Aktifkan izin kamera di iPhone Settings > Safari";}}}
}
function setZoom(z){try{const track=html5QrcodeScanner.getRunningTrack();track.applyConstraints({advanced:[{zoom:Math.min(z,track.getCapabilities().zoom.max)}]});}catch(e){}}
function paksaFokus(){try{const track=html5QrcodeScanner.getRunningTrack();track.applyConstraints({advanced:[{focusMode:"continuous"}]});}catch{html5QrcodeScanner.stop().then(()=>startCam());}}
function toggleTorch(){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.torch){torchOn=!torchOn;track.applyConstraints({advanced:[{torch:torchOn}]});}}catch(e){}}
async function gantiKamera(){try{await html5QrcodeScanner.stop();}catch{}startCam();}
async function autoSave(){
  if(html5QrcodeScanner){try{await html5QrcodeScanner.stop();}catch(e){}}
  let bagian=localStorage.getItem('bagian')||TYPE;
  const wib=getWIBDateTime(); let tgl_input=wib.tgl_client; let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
  const GOOGLE_URL="https://script.google.com/macros/s/AKfycbyh3iNQV_kjmj5Xougv71g7gxf9K16OMxdhsVVhifOXcR5PRKSP670k3Bq--Oz05UF7Sw/exec";
  if(TYPE=='BALL'){
    listBak.forEach(qr=>{if(!qr) return;let idx=all.findIndex(d=>d.QR_BAK==qr);if(idx==-1){all.push({QR_BAK:qr,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_client_id,JAM_CLIENT:wib.jam_client,waktu:wib.full_client,status:'Lokal'});}else{all[idx].ID_BALL=res['ID BALL']||'';all[idx].NO_BOX=res['NO BOX']||'';all[idx].BAGIAN=bagian;}});
    localStorage.setItem('riwayat',JSON.stringify(all)); localStorage.setItem('riwayat_scan',JSON.stringify(all));
    let kirim={TYPE:'BALL_8',LIST_BAK:listBak,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TGL_KMS:tgl_input,TGL_CLIENT:wib.tgl_client_id,JAM_CLIENT:wib.jam_client,TGL_JAM_CLIENT:wib.full_client};
    document.getElementById('status').innerText="⏳ KIRIM 8 BAK..."; try{await fetch(GOOGLE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(kirim)});document.getElementById('status').innerText="✅ 8 BAK TERKIRIM "+wib.full_client;}catch(e){document.getElementById('status').innerText="⚠️ OFFLINE - RIWAYAT AMAN";}
    setTimeout(()=>{alert('✅ Tersimpan 8 BAK! BALL: '+res['ID BALL']+'\nJam: '+wib.full_client);location.href='index.html';},800); return;
  }
  let qr=res['QR CODE BAK']||''; let idx=all.findIndex(d=>d.QR_BAK==qr&&!d.ID_BALL); if(idx==-1){all.push({QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:TYPE=='KMS'?res['ID KMS']||'':'',ID_PACK:TYPE=='PACK'?res['ID PACK']||'':'',ID_BDL:TYPE=='BDL'?res['ID BDL']||'':'',BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_client_id,JAM_CLIENT:wib.jam_client,waktu:wib.full_client,status:'Lokal'});}
  else { if(TYPE=='KMS') all[idx].ID_KMS=res['ID KMS']||''; if(TYPE=='PACK') all[idx].ID_PACK=res['ID PACK']||''; if(TYPE=='BDL'){ all[idx].ID_BDL=res['ID BDL']||''; } }
  localStorage.setItem('riwayat',JSON.stringify(all)); localStorage.setItem('riwayat_scan',JSON.stringify(all));
  let kirim={QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:res['ID KMS']||'',ID_PACK:res['ID PACK']||'',ID_BDL:res['ID BDL']||'',BAGIAN:bagian,TGL_KMS:tgl_input,TGL_CLIENT:wib.tgl_client_id,JAM_CLIENT:wib.jam_client,TGL_JAM_CLIENT:wib.full_client,TYPE:TYPE};
  document.getElementById('status').innerText="⏳ KIRIM... "+wib.full_client;
  try{await fetch(GOOGLE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(kirim)});document.getElementById('status').innerText="✅ TERKIRIM "+wib.full_client;}catch(e){document.getElementById('status').innerText="⚠️ OFFLINE - RIWAYAT AMAN "+wib.full_client;}
  if(TYPE=='BDL'){ let c=hitungBDL(res['ID BDL']||''); document.getElementById('bdlCounter').style.display='block'; document.getElementById('bdlCounter').innerText=`🔢 Total scan BDL ${res['ID BDL']} = ${c}x`; }
  setTimeout(()=>{alert('✅ Tersimpan! '+TYPE+' - '+qr+'\nJam: '+wib.full_client);location.href='index.html';},800);
}
     // === AUTO HAPUS RIWAYAT 7 HARI ===
function autoHapusRiwayatHP_Mingguan(){
  let last = localStorage.getItem('lastHapus');
  let now = Date.now();
  // 7 hari = 604800000
  if(!last || (now - last) > 604800000){
    localStorage.removeItem('riwayatScan');
    localStorage.setItem('lastHapus', now);
    console.log('Riwayat HP dihapus otomatis mingguan');
  }
}
function renderRiwayat(){
  try{
    let data = JSON.parse(localStorage.getItem('riwayat')||'[]');
    let box = document.getElementById('listRiwayat');
    let riwayatBox = document.getElementById('riwayatBox');
    if(!box) return;
    if(data.length==0){
      box.innerHTML='<div style="color:#888">Kosong</div>';
      if(riwayatBox) riwayatBox.style.display='none';
      return;
    }
    if(riwayatBox) riwayatBox.style.display='block';
    box.innerHTML = data.slice(-20).reverse().map(d=>`<div style="border-bottom:1px solid #ddd;padding:4px 0;color:#000">${d.QR_BAK||''} - ${d.BAGIAN||''} - ${d.waktu||''}</div>`).join('');
  }catch(e){}
}

autoHapusRiwayatHP_Mingguan();
renderRiwayat();
renderSteps();startCam();
</script></body></html><script async src="/.netlify/scripts/hud?variant=public" data-nf-variant="public" data-netlify-site-id="7b242c25-0d42-4a6a-bcde-ca4af98bdb84" data-app-host="app.netlify.com" data-account-tier="free"></script>
