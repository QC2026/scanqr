<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {

          }
        }
      };

}
function getWIBDateTime(){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Jakarta',
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
    hour12:false
  });
  const parts = fmt.formatToParts(now).reduce((a,p)=>{a[p.type]=p.value; return a;},{});
  const tgl_id = `${parts.day}/${parts.month}/${parts.year}`;
  const jam = `${parts.hour}:${parts.minute}:${parts.second}`.replace(/\./g,':').replace(/;/g,':');
  const full_display = `${tgl_id} ${jam} WIB`;
  return { tgl_id: tgl_id, jam: jam, full_display: full_display, iso: now.toISOString(), milis: now.getTime() };
}
function hitungBDL(id){if(!id)return 0;try{let all=JSON.parse(localStorage.getItem('riwayat_scan')||'[]');let todayID=new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'});return all.filter(d=>{let w=(d.waktu||'')+' '+(d.TGL_CLIENT||'');return w.includes(todayID)&&(d.ID_BDL||'').toUpperCase()==id.toUpperCase()}).length}catch(e){return 0}}
let lastScan="";let lastTime=0;function cegahDoubleScan(v){let now=Date.now();if(v===lastScan&&(now-lastTime)<3000)return"Sabar,ojo di scan dobel!";lastScan=v;lastTime=now;return""}
function validatePager(value, step){
  if(!value || !step) return "STEP/VALUE KOSONG!";
  value = value.trim().toUpperCase();
  step = step.toString().toUpperCase().replace(/[\s_-]/g,"");
  try{ let d = cegahDoubleScan(value); if(d) return d }catch(e){}
  if(step.includes('BAK') || step === 'QR' || step.includes('QRBAK')){
    if(/^\d+$/.test(value)) return "SALAH! INI BUKAN QR BAK !";
    if(/^\d{5,6}$/.test(value)) return "SALAH! INI NO ID ANGKA TOK!";
    if(/^BAK-\d+$/.test(value)) return "";
    if(/^G\d+-\d+$/.test(value)) return "";
    if(!value.includes('-')) return "SALAH! HARUS G1-001 ATAU BAK-1234!";
    if(value.length < 4) return "SALAH! KEPENDEKAN!";
    if(/^[A-Z]+\d*-\d+$/.test(value)) return "";
    return "SALAH! FORMAT HARUS G1-001 ATAU BAK-1234!";
  }
  if(step.includes('IDPC') || step.includes('IDGL') || step.includes('IDKMS') || step.includes('IDPACK') || step.includes('IDBDL')){
    if(value.includes('-') || value.includes('BAK')) return "SALAH! INI QR BAK, BUKAN ID!";
    if(/[A-Z]/.test(value)) return "SALAH! INI QR BAK, BUKAN ID!";
    if(!/^\d{5,6}$/.test(value)) return "SALAH! ID HARUS 5-6 ANGKA!";
    return "";
  }
  if(step.includes('IDBALL') || step.includes('BALL') || step.includes('BOX')){
    if (/^[A-Z]+-\d{1,4}$/.test(value)) return "";
    if (/^BOX-\d{1,4}$/.test(value)) return "";
    if(step.includes('BOX')){ return "SALAH! NO BOX WAJIB BOX-...! CONTOH: BOX-027"; }
    return "SALAH! FORMAT HARUS NAMA-13 ATAU BOX-027! CONTOH: FAUZIAH-13";
  }
  return "";
}
const GOOGLE_URL="https://script.google.com/macros/s/AKfycbxeV0P-hdypgH8tcphBo-Jb54uYFf5eNj-tVNAX2MXYmI-FXez-9KM2fppjuURkDCABUg/exec";
const TYPE=(localStorage.getItem('scan_type')||'BALL').toUpperCase();document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],'KMS':['QR CODE BAK','ID KMS'],'PACK':['QR CODE BAK','ID PACK'],'BDL':['QR CODE BAK','ID BDL'],'BALL':['QR CODE BAK','ID BALL','NO BOX']};
let flow=FLOWS[TYPE]||FLOWS['BALL'];let cur=0;let res={};let listBak=[];let html5QrcodeScanner;let lastScanTime=0;let isPause=false;let tempScan="";let torchOn=false;
let currentBatchId="";
let isMengirimAntrean=false;
function updateAntreanBox(){
  try{
    let all=JSON.parse(localStorage.getItem('riwayat_scan')||'[]');
    let pending=new Set(all.filter(d=>d.status!=='Terkirim').map(d=>d.BATCH_ID)).size;
    let terkirim=new Set(all.filter(d=>d.status==='Terkirim').map(d=>d.BATCH_ID)).size;
    let el=document.getElementById('antreanBox');
    if(el) el.innerText=`📤 ANTREAN: ${pending} | ✅ TERKIRIM: ${terkirim}`;
  }catch(e){}
}
  async function processQueue(silent=false){
   if(!navigator.online)return;
  if(isMengirimAntrean) return;
  let all=JSON.parse(localStorage.getItem('riwayat_scan')||'[]');
  let bersih = all.filter(d => d.QR_BAK && d.QR_BAK.trim() !== "");
  if(bersih.length !== all.length){
    localStorage.setItem('riwayat_scan', JSON.stringify(bersih));
    localStorage.setItem('riwayat', JSON.stringify(bersih));
    all = bersih;
  }
  let pendingBatch=all.find(d=>d.status!=='Terkirim');
  if(!pendingBatch){ updateAntreanBox(); return; }
  let batchId=pendingBatch.BATCH_ID;
  let items=all.filter(d=>d.BATCH_ID===batchId);
  let first=items[0];
  if(!first || !first.QR_BAK){
    let sisa=all.filter(d=>d.BATCH_ID!==batchId);
    localStorage.setItem('riwayat_scan', JSON.stringify(sisa));
    isMengirimAntrean=false;
    setTimeout(processQueue,500);
    return;
  }
  
  if(first.ID_BALL !== undefined && (!first.ID_BALL || !first.NO_BOX)){
    console.log("Batch blm lengkap, skip:", batchId);
    isMengirimAntrean=false;
    return;
  }
  isMengirimAntrean=true;
  let wib2=getWIBDateTime();
  let kirim;
  if(items.length>1 || (first.ID_BALL)){
    let listBakKirim=items.map(d=>d.QR_BAK);
    kirim={ TYPE:'BALL_8', LIST_BAK:listBakKirim, ID_BALL:first.ID_BALL||'', NO_BOX:first.NO_BOX||'', BAGIAN:first.BAGIAN||TYPE, TGL_CLIENT:first.TGL_CLIENT||wib2.tgl_id, TGL_JAM_CLIENT:first.TGL_JAM_CLIENT||wib2.full_display, JAM_HP:wib2.full_display, TGL_ISO:wib2.iso, JAM_MILIS:wib2.milis, JAM_CLIENT:wib2.jam, TARGET_SHEET:"", BATCH_ID:batchId };
  } else {
    kirim={ QR_BAK:first.QR_BAK||'', ID_PC:first.ID_PC||'', ID_GL:first.ID_GL||'', ID_GL2:first.ID_GL2||'', ID_KMS:first.ID_KMS||'', ID_PACK:first.ID_PACK||'', ID_BDL:first.ID_BDL||'', BAGIAN:first.BAGIAN||TYPE, TGL_CLIENT:first.TGL_CLIENT||wib2.tgl_id, TGL_JAM_CLIENT:first.TGL_JAM_CLIENT||wib2.full_display, JAM_HP:wib2.full_display, TGL_ISO:wib2.iso, JAM_MILIS:wib2.milis, JAM_CLIENT:wib2.jam, TYPE:(first.BAGIAN||TYPE), TARGET_SHEET:"", BATCH_ID:batchId };
    if(first.ID_GL2) kirim.ID_GL2=first.ID_GL2;
  }
  let statusEl=document.getElementById('status');
  if(statusEl) statusEl.innerText="⏳ lagi kirim... Antrean: "+batchId;
    const r=await fetch(GOOGLE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(kirim)});
    const txt=await r.text();
    let txtUp=(txt||"").toUpperCase();
    if(!r.ok || txtUp.includes("ERROR") || txtUp.includes("GAGAL") || txtUp.includes("FAILED")) throw new Error("Sheet nolak: "+txt);
    try{
    let wibKirim=getWIBDateTime();
    let all2=JSON.parse(localStorage.getItem('riwayat_scan')||'[]');
    all2.forEach(d=>{ if(d.BATCH_ID===batchId){ d.status='Terkirim'; d.JAM_KIRIM=wibKirim.jam; }});
    localStorage.setItem('riwayat_scan',JSON.stringify(all2));
    localStorage.setItem('riwayat',JSON.stringify(all2));
    // HAPUS dari antrean kirim
    let ant = JSON.parse(localStorage.getItem('antrean')||'[]');
    ant = ant.filter(d => d.BATCH_ID !== batchId);
    localStorage.setItem('antrean', JSON.stringify(ant));
    localStorage.setItem('antrean_scan', JSON.stringify(ant));
    if(statusEl) statusEl.innerText="✅ selesai kirim ! Lanjut scan...";
    isMengirimAntrean=false;
    updateAntreanBox();renderRiwayat();
    setTimeout(processQueue,500);
  }catch(e){
    console.log("Antrean gagal, coba lagi 3 detik:",e);
    if(statusEl) statusEl.innerText=`⚠️ Sinyal jelek, coba lagi 3 detik... Data aman di Antrean`;
    isMengirimAntrean=false;
    updateAntreanBox();
    setTimeout(processQueue,3000);
  }
} 
function renderSteps(){let h='';if(TYPE=='BALL'){if(cur==0)h+=`<span class="step active">▶ QR BAK [${listBak.length}/8]</span>`;else h+=`<span class="step done">✓ QR BAK [8/8]</span>`;flow.slice(1).forEach((s,i)=>{let idx=i+1;let cls=idx<cur?'done':idx==cur?'active':'wait';h+=`<span class="step ${cls}">${idx<cur?'✓ ':idx==cur?'▶ ':''}${s}</span>`});document.getElementById('step-info').innerText=cur==0?`Siap Scan [${listBak.length}/8]`:flow[cur];document.getElementById('list-preview').style.display='block'}else{flow.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'wait';h+=`<span class="step ${cls}">${i<cur?'✓ ':i==cur?'▶ ':''}${s}</span>`});document.getElementById('step-info').innerText=flow[cur]||'Siap Scan';document.getElementById('list-preview').style.display='none'}document.getElementById('steps').innerHTML=h}
function onScanSuccess(decoded){if(isPause)return;const now=Date.now();if(now-lastScanTime<800)return;lastScanTime=now;decoded=decoded.trim().toUpperCase();let stepSaiki=flow[cur]||TYPE;let cek=validatePager(decoded,stepSaiki);if(cek){document.getElementById('status').innerText='⛔ '+cek;return}if(TYPE=='BALL'&&cur==0){if(listBak.includes(decoded)){document.getElementById('status').innerText='⚠️ QR udah ada!';return}listBak.push(decoded);document.getElementById('list-preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');renderSteps();document.getElementById('status').innerText=`✅ Masuk ${listBak.length}/8`;if(listBak.length<8)return;document.getElementById('list8Preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');document.getElementById('verify8Box').style.display='block';isPause=true;try{html5QrcodeScanner.pause(true)}catch(e){}return}isPause=true;tempScan=decoded;try{html5QrcodeScanner.pause(true)}catch(e){}document.getElementById('resStep').innerText=flow[cur];document.getElementById('resValue').innerText=decoded;document.getElementById('extraInfo').innerText='';if(TYPE=='BDL'&&flow[cur]=='ID BDL'){let c=hitungBDL(decoded)+1;document.getElementById('extraInfo').innerText=`🔢 BDL ${decoded} `;document.getElementById('bdlCounter').style.display='block';document.getElementById('bdlCounter').innerText=`🔢 BDL ${decoded} = ${c}x hari ini`}document.getElementById('resultBox').style.display='block'}
function confirm8(){document.getElementById('verify8Box').style.display='none';cur=1;renderSteps();document.getElementById('status').innerText='8 BAK OK! Scan ID BALL';isPause=false;try{html5QrcodeScanner.resume()}catch(e){}}
function ulang8(){document.getElementById('verify8Box').style.display='none';listBak=[];document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';renderSteps();document.getElementById('status').innerText='🔄 Ulang 8 QR';isPause=false;try{html5QrcodeScanner.resume()}catch(e){}}
function confirmScan(){document.getElementById('resultBox').style.display='none';res[flow[cur]]=tempScan;if(TYPE=='BDL'&&flow[cur]=='ID BDL'){document.getElementById('jmlPasok').style.display='block';document.getElementById('jmlBdl').value='';document.getElementById('jmlBdl').focus();return}cur++;renderSteps();if(cur>=flow.length){autoSave()}else{isPause=false;try{html5QrcodeScanner.resume()}catch(e){}lastScanTime=Date.now()}}
function kirimBdl(){let j=document.getElementById('jmlBdl').value.trim();if(!j){alert('Isi dulu JML PASOK !');return}res['JML']=j;document.getElementById('jmlPasok').style.display='none';cur++;renderSteps();if(cur>=flow.length){autoSave()}else{isPause=false;try{html5QrcodeScanner.resume()}catch(e){}lastScanTime=Date.now()}}
function ulangCurrent(){document.getElementById('resultBox').style.display='none';isPause=false;tempScan="";lastScanTime=0;try{html5QrcodeScanner.resume()}catch(e){}}
function inputManual(){let el=document.getElementById('manual');let v=el.value.trim();if(!v){el.focus();document.getElementById('status').innerText='⚠️ Ketik QR dulu';return}v=v.toUpperCase();el.value='';onScanSuccess(v)}
function resetScan(){cur=0;res={};listBak=[];lastScanTime=0;isPause=false;tempScan="";document.getElementById('resultBox').style.display='none';document.getElementById('verify8Box').style.display='none';document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';document.getElementById('bdlCounter').style.display='none';renderSteps();try{html5QrcodeScanner.resume()}catch(e){}}
async function startCam(){
  html5QrcodeScanner = new Html5Qrcode("reader");
 const config = {fps:15, qrbox:{width:280, height:280}};
  try{ await html5QrcodeScanner.start({facingMode:{exact:"environment"}}, config, onScanSuccess, ()=>{}); document.getElementById('status').innerText="✅ Kamera belakang aktif"; setTimeout(()=>setZoom(2.5),600); return; }catch(e){}
  try{ await html5QrcodeScanner.start({facingMode:"environment"}, config, onScanSuccess, ()=>{}); document.getElementById('status').innerText="✅ Kamera belakang aktif"; setTimeout(()=>setZoom(2.5),600); return; }catch(e){}
  try{ await html5QrcodeScanner.start({facingMode:"user"}, config, onScanSuccess, ()=>{}); document.getElementById('status').innerText="✅ Kamera depan aktif (mode Laptop)"; return; }catch(e){}
  try{ let cams = await Html5Qrcode.getCameras(); if(cams && cams.length){ await html5QrcodeScanner.start(cams[0].id, config, onScanSuccess, ()=>{}); document.getElementById('status').innerText="✅ Kamera aktif: "+cams[0].label; return; } }catch(e){}
  document.getElementById('status').innerText="❌ Kamera diblokir - cek izin kamera di Chrome";
}
function setZoom(z){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.zoom){track.applyConstraints({advanced:[{zoom:Math.min(z,cap.zoom.max)}]})}}catch(e){}}
function paksaFokus(){try{const track=html5QrcodeScanner.getRunningTrack();track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch{html5QrcodeScanner.stop().then(()=>startCam())}}
function toggleTorch(){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.torch){torchOn=!torchOn;track.applyConstraints({advanced:[{torch:torchOn}]})}}catch(e){}}
async function gantiKamera(){try{await html5QrcodeScanner.stop()}catch{}startCam()}
// === AUTOSAVE BARU: SIMPEN LANGSUNG LANJUT SCAN ===
async function autoSave(){
  let bagian=localStorage.getItem('bagian')||TYPE;
  const wib=getWIBDateTime();
  let tgl_input=wib.tgl_id;
  currentBatchId='B'+wib.milis+'-'+Math.floor(Math.random()*1000);
  try{
    let all=JSON.parse(localStorage.getItem('riwayat_scan')||'[]');
    if(TYPE=='BALL'){
      listBak.forEach(qr=>{
        if(!qr) return;
        all.push({ BATCH_ID:currentBatchId, QR_BAK:qr,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'', BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_id, JAM_SCAN:wib.jam,JAM_KIRIM:'-', waktu:wib.full_display,TGL_JAM_CLIENT:wib.full_display, status:'Lokal (Pending)' });
      });
    } else {
      let qr=res['QR CODE BAK']||'';
      // GL: simpen ID_GL2 juga 
      all.push({ BATCH_ID:currentBatchId, QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'', ID_KMS:TYPE=='KMS'?res['ID KMS']||'':'',ID_PACK:TYPE=='PACK'?res['ID PACK']||'':'',ID_BDL:TYPE=='BDL'?res['ID BDL']||'':'', BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_id, JAM_SCAN:wib.jam,JAM_KIRIM:'-', waktu:wib.full_display,TGL_JAM_CLIENT:wib.full_display, status:'Lokal (Pending)' });
    }
    localStorage.setItem('riwayat_scan',JSON.stringify(all));
    localStorage.setItem('riwayat',JSON.stringify(all));
  }catch(err){ alert("Gagal simpen riwayat: "+err); return; }
  // LANGSUNG RESET & LANJUT SCAN 
  document.getElementById('status').innerText="✅ SUDAH DI SAVE DI HP! balik ke halaman 1 ... ";
  cur=0; res={}; listBak=[]; isPause=false; tempScan="";
  document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';
  renderSteps(); updateAntreanBox();
  try{ html5QrcodeScanner.resume(); }catch(e){}
  lastScanTime=Date.now();
  // Kirim di belakang layar, ora ngunci scan
  processQueue();
}
function parseTanggalID(tglStr, jamStr){
  try{ let p=(tglStr||'').split('/'); if(p.length!=3) return NaN; let j=(jamStr||'00:00:00').split(':'); return new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]), parseInt(j[0]||0), parseInt(j[1]||0)).getTime(); }catch(e){ return NaN; }
}
function renderRiwayat(){
  let all = JSON.parse(localStorage.getItem('riwayat_scan')||'[]');
  let wadah = document.getElementById('list-riwayat');
  if(!wadah) return;
  let sekarang = Date.now();
  let seminggu = 7 * 24 * 60 * 60 * 1000;
  all = all.filter(r => {
    let tgl = parseTanggalID(r.TANGGAL, r.JAM_SCAN);
    if(isNaN(tgl)) return true;
    return (sekarang - tgl) < seminggu;
  });
  localStorage.setItem('riwayat_scan', JSON.stringify(all));
  if(all.length==0){ wadah.innerHTML = '<div style="text-align:center;padding:20px">Belum ada scan hari ini (7 hari terakhir)</div>'; return; }
  let html = '';
  all.forEach(r=>{
    let warna = r.status=='Terkirim' ? '#d4edda' : '#fff3cd';
    let icon = r.status=='Terkirim' ? '✅' : '⏳';
    let jamKirim = r.JAM_KIRIM && r.JAM_KIRIM!='-' ? r.JAM_KIRIM : 'Belum kekirim';
    html += `<div style="background:${warna};margin:5px 0;padding:10px;border-radius:8px;border-left:4px solid ${r.status=='Terkirim'?'green':'orange'}"><div style="font-weight:bold">${icon} QR: ${r.QR_BAK}</div><div style="font-size:12px;color:#333">📅 ${r.TANGGAL} | 📷 SCAN: <b>${r.JAM_SCAN||'-'}</b> | 📤 KIRIM: <b>${jamKirim}</b></div><div style="font-size:11px;color:#666">BAGIAN: ${r.BAGIAN||'-'} | ${r.ID_KMS||r.ID_PACK||r.ID_BDL||r.ID_BALL||''} | Status: ${r.status}</div></div>`;
  });
  wadah.innerHTML = html;
}
function updateJamLive(){const wib=getWIBDateTime();const el=document.getElementById('jamLive');if(el)el.innerText=wib.tgl_id+' '+wib.jam+' WIB'}
setInterval(updateJamLive,1000);
updateJamLive();
renderSteps();startCam();
updateAntreanBox();
setTimeout(processQueue,1000);
setInterval(()=>{if(navigator.online) processQueue(true);},5000);
