<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PT URIP SUGIARTO</title>
<script src="html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#ffd700;font-family:sans-serif;padding:12px}
.header{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #c9a84c;border-radius:12px;padding:10px}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{background:#111;border:2px solid #c9a84c;border-radius:12px;padding:12px;margin-top:12px}
.step{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;border:1px solid #444}
.active{background:gold;color:black}.done{background:#0f0;color:black}.wait{background:#222;color:#888}
#reader{width:100%;min-height:60vh;background:#000;border-radius:12px;overflow:hidden;margin-top:12px}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
#reader__dashboard_section_csr, #reader__scan_region{display:none!important}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;box-sizing:border-box;margin-top:8px}
#resultBox,#verify8Box{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;padding:20px;box-sizing:border-box;overflow:auto}
.card{background:#1a1a1a;border:3px solid gold;border-radius:16px;padding:20px;text-align:center;margin-top:10%}
#list-preview{background:#000;border:1.5px solid #0f0;border-radius:8px;padding:8px;margin-top:8px;max-height:180px;overflow:auto;text-align:left;font-size:13px;color:#0f0}
#scan-guide{width:65%;height:42%;max-width:320px;max-height:320px;border:4px solid #ffeb00;border-radius:12px;position:relative;margin:0 auto;top:15%;display:flex;justify-content:center;pointer-events:none}
#scan-guide span{position:absolute;top:-14px;background:#ffeb00;color:#000;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px}
</style>
</head>
<body>
<div class="header"><div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIP SUGIARTO</div></div>
<div class="box">
<div style="font-weight:900;color:#ffdf8a" id="tipe">SCAN</div>
<div id="steps" style="margin-top:8px"></div>
<div id="step-info" style="text-align:center;margin-top:8px;font-weight:900;color:gold">Siap Scan</div>
<div id="jamLive" style="text-align:center;margin-top:6px;font-weight:900;color:#0f0;background:#000;border:1px solid #333;padding:6px;border-radius:8px;font-size:13px">Loading jam...</div>
<div id="reader"><div id="scan-guide"><span>ARAHKAN QR KESINI</span></div></div>
<div id="list-preview"><div style="color:#888">Belum ada QR BAK - Scan 8x</div></div>
<button onclick="paksaFokus()" class="btn" style="background:#2563eb;color:white">🔍 TAP JIKA BLUR</button>
<div style="display:flex;gap:6px">
<button onclick="setZoom(1)" class="btn" style="background:#333;color:white;flex:1">1x</button>
<button onclick="setZoom(2.5)" class="btn" style="background:gold;color:black;flex:1">2.5x</button>
<button onclick="toggleTorch()" class="btn" style="background:#333;color:white;flex:1">🔦</button>
<button onclick="gantiKamera()" class="btn" style="background:#0d2a54;color:white;flex:1;border:2px solid #2a5aa8">🔄</button>
</div>
<input id="manual" placeholder="Ketik manual jika QR rusak">
<button onclick="inputManual()" class="btn" style="background:#333;color:white">INPUT MANUAL</button>
<div id="status" style="text-align:center;margin-top:10px;color:#0f0;font-weight:900"></div>
<div id="bdlCounter" style="display:none;text-align:center;margin-top:8px;background:#ffeb00;color:#000;font-weight:900;padding:8px;border-radius:8px"></div>
<button onclick="resetScan()" class="btn" style="background:#222;color:white">🔄 ULANG SEMUA</button>
</div>
<button onclick="location.href='index.html'" class="btn" style="background:#b91c1c;color:white;border:2px solid gold">⬅ KEMBALI KEHALAMAN 1</button>
<div id="resultBox"><div class="card"><div id="resStep" style="color:gold;font-weight:900;font-size:14px"></div><h2 style="color:white;margin:8px 0">Hasil Scan:</h2><h1 id="resValue" style="color:#0f0;word-break:break-all;font-size:22px;background:#000;padding:14px;border-radius:8px;border:1px solid #444"></h1><div id="extraInfo" style="color:#ffeb00;margin-top:10px;font-weight:700"></div><div style="display:flex;gap:10px;margin-top:18px"><button onclick="confirmScan()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI</button><button onclick="ulangCurrent()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG</button></div></div></div>
<div id="verify8Box"><div class="card" style="border-color:#0f0"><h2 style="color:#0f0">✅ 8 QR TERKUMPUL</h2><div id="list8Preview" style="background:#000;border:1px solid #444;border-radius:8px;padding:8px;max-height:260px;overflow:auto;text-align:left;font-size:13px;color:#0f0;margin-top:10px"></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="confirm8()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI LANJUT</button><button onclick="ulang8()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG 8 QR</button></div></div></div>
<script>
function getWIBDateTime(){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Jakarta',
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
    hour12:false
  });
  const parts = fmt.formatToParts(now).reduce((a,p)=>{a[p.type]=p.value; return a;},{});
  const tgl_id = `${parts.day}/${parts.month}/${parts.year}`; // 05/11/2026 - FIX dd/MM
  const jam = `${parts.hour}:${parts.minute}:${parts.second}`.replace(/\./g,':').replace(/;/g,':');
  const full_display = `${tgl_id} ${jam} WIB`;
  return {
    tgl_id: tgl_id,
    jam: jam,
    full_display: full_display,
    iso: now.toISOString(), 
    milis: now.getTime() 
  };
}
function hitungBDL(id){if(!id)return 0;try{let all=JSON.parse(localStorage.getItem('riwayat')||'[]');let todayID=new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'});return all.filter(d=>{let w=(d.waktu||'')+' '+(d.TGL_CLIENT||'');return w.includes(todayID)&&(d.ID_BDL||'').toUpperCase()==id.toUpperCase()}).length}catch(e){return 0}}
let lastScan="";let lastTime=0;function cegahDoubleScan(v){let now=Date.now();if(v===lastScan&&(now-lastTime)<3000)return"Sabar,ojo di scan dobel!";lastScan=v;lastTime=now;return""}
function validatePager(value, step){
  if(!value || !step) return "STEP/VALUE KOSONG!";
  value = value.trim().toUpperCase();
  step = step.toString().toUpperCase().replace(/[\s_-]/g,"");

  try{
    let d = cegahDoubleScan(value);
    if(d) return d
  }catch(e){}

  // 1. VALIDASI BAK / QR BAK
  if(step.includes('BAK') || step === 'QR' || step.includes('QRBAK')){
    if(/^\d+$/.test(value)) return "SALAH! INI BUKAN QR BAK !";
    if(/^\d{5,6}$/.test(value)) return "SALAH! INI NO ID ANGKA TOK!";
    if(/^BAK-\d+$/.test(value)) return "";
    if(/^G\d+-\d+$/.test(value)) return "";
    if(!value.includes('-')) return "SALAH! HARUS G1-001 ATAU BAK-1234!";
    if(value.length < 4) return "SALAH! KEPENDEKAN!";
    if(/^[A-Z]+\d*-\d+$/.test(value)) return "";
    return "SALAH! FORMAT HARUS G1-001 ATAU BAK-1234!";
  }

  // 2. VALIDASI ID KMS, PACK, BDL, GL, PC (angka 5-6 digit)
  if(step.includes('IDPC') || step.includes('IDGL') || step.includes('IDKMS') || step.includes('IDPACK') || step.includes('IDBDL')){
    if(value.includes('-') || value.includes('BAK')) return "SALAH! INI QR BAK, BUKAN ID!";
    if(/[A-Z]/.test(value)) return "SALAH! INI QR BAK, BUKAN ID!";
    if(!/^\d{5,6}$/.test(value)) return "SALAH! ID HARUS 5-6 ANGKA!";
    return "";
  }

  // 3. VALIDASI KHUSUS BALL & BOX (SUDAH DIHAPUS YANG NGACO, JADI KETAT)
  if(step.includes('IDBALL') || step.includes('BALL') || step.includes('BOX')){
    // Format bener: FAUZIAH-13, FAUZAN-21, EKO-12, BOX-027
    
    if (/^[A-Z]+-\d{1,4}$/.test(value)) return ""; // FAUZIAH-13
    if (/^BOX-\d{1,4}$/.test(value)) return ""; // BOX-027 -> INI KHUSUS NO BOX WAJIB BOX-

    // Kalo NO BOX gak ada BOX- nya, TOLAK
    if(step.includes('BOX')){
      return "SALAH! NO BOX WAJIB BOX-...! CONTOH: BOX-027";
    }

    return "SALAH! FORMAT HARUS NAMA-13 ATAU BOX-027! CONTOH: FAUZIAH-13";
  }

  return "";
}
// Helper biar gak double scan (kalo ada)
function cegahDoubleScan(val){
  // kalo gak ada function ini, biarin aja return kosong
  return "";
}
const GOOGLE_URL="https://script.google.com/macros/s/AKfycbyh3iNQV_kjmj5Xougv71g7gxf9K16OMxdhsVVhifOXcR5PRKSP670k3Bq--Oz05UF7Sw/exec";
const TYPE=(localStorage.getItem('scan_type')||'BALL').toUpperCase();document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],'KMS':['QR CODE BAK','ID KMS'],'PACK':['QR CODE BAK','ID PACK'],'BDL':['QR CODE BAK','ID BDL'],'BALL':['QR CODE BAK','ID BALL','NO BOX']};
let flow=FLOWS[TYPE]||FLOWS['BALL'];let cur=0;let res={};let listBak=[];let html5QrcodeScanner;let lastScanTime=0;let isPause=false;let tempScan="";let torchOn=false;
function renderSteps(){let h='';if(TYPE=='BALL'){if(cur==0)h+=`<span class="step active">▶ QR BAK [${listBak.length}/8]</span>`;else h+=`<span class="step done">✓ QR BAK [8/8]</span>`;flow.slice(1).forEach((s,i)=>{let idx=i+1;let cls=idx<cur?'done':idx==cur?'active':'wait';h+=`<span class="step ${cls}">${idx<cur?'✓ ':idx==cur?'▶ ':''}${s}</span>`});document.getElementById('step-info').innerText=cur==0?`Siap Scan [${listBak.length}/8]`:flow[cur];document.getElementById('list-preview').style.display='block'}else{flow.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'wait';h+=`<span class="step ${cls}">${i<cur?'✓ ':i==cur?'▶ ':''}${s}</span>`});document.getElementById('step-info').innerText=flow[cur]||'Siap Scan';document.getElementById('list-preview').style.display='none'}document.getElementById('steps').innerHTML=h}
function onScanSuccess(decoded){if(isPause)return;const now=Date.now();if(now-lastScanTime<800)return;lastScanTime=now;decoded=decoded.trim().toUpperCase();let stepSaiki=flow[cur]||TYPE;let cek=validatePager(decoded,stepSaiki);if(cek){document.getElementById('status').innerText='⛔ '+cek;return}if(TYPE=='BALL'&&cur==0){if(listBak.includes(decoded)){document.getElementById('status').innerText='⚠️ QR udah ada!';return}listBak.push(decoded);document.getElementById('list-preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');renderSteps();document.getElementById('status').innerText=`✅ Masuk ${listBak.length}/8`;if(listBak.length<8)return;document.getElementById('list8Preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');document.getElementById('verify8Box').style.display='block';isPause=true;try{html5QrcodeScanner.pause(true)}catch(e){}return}isPause=true;tempScan=decoded;try{html5QrcodeScanner.pause(true)}catch(e){}document.getElementById('resStep').innerText=flow[cur];document.getElementById('resValue').innerText=decoded;document.getElementById('extraInfo').innerText='';if(TYPE=='BDL'&&flow[cur]=='ID BDL'){let c=hitungBDL(decoded)+1;document.getElementById('extraInfo').innerText=`🔢 BDL ${decoded} = ${c}x`;document.getElementById('bdlCounter').style.display='block';document.getElementById('bdlCounter').innerText=`🔢 BDL ${decoded} = ${c}x hari ini`}document.getElementById('resultBox').style.display='block'}
function confirm8(){document.getElementById('verify8Box').style.display='none';cur=1;renderSteps();document.getElementById('status').innerText='8 BAK OK! Scan ID BALL';isPause=false;try{html5QrcodeScanner.resume()}catch(e){}}
function ulang8(){document.getElementById('verify8Box').style.display='none';listBak=[];document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';renderSteps();document.getElementById('status').innerText='🔄 Ulang 8 QR';isPause=false;try{html5QrcodeScanner.resume()}catch(e){}}
function confirmScan(){document.getElementById('resultBox').style.display='none';res[flow[cur]]=tempScan;cur++;renderSteps();if(cur>=flow.length){autoSave()}else{isPause=false;try{html5QrcodeScanner.resume()}catch(e){}lastScanTime=Date.now()}}
function ulangCurrent(){document.getElementById('resultBox').style.display='none';isPause=false;tempScan="";lastScanTime=0;try{html5QrcodeScanner.resume()}catch(e){}}
function inputManual(){let el=document.getElementById('manual');let v=el.value.trim();if(!v){el.focus();document.getElementById('status').innerText='⚠️ Ketik QR dulu';return}v=v.toUpperCase();el.value='';onScanSuccess(v)}
function resetScan(){cur=0;res={};listBak=[];lastScanTime=0;isPause=false;tempScan="";document.getElementById('resultBox').style.display='none';document.getElementById('verify8Box').style.display='none';document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya</div>';document.getElementById('bdlCounter').style.display='none';renderSteps();try{html5QrcodeScanner.resume()}catch(e){}}
async function startCam(){
  html5QrcodeScanner = new Html5Qrcode("reader");
 const config = {fps:10, qrbox:{width:280, height:280}};
  // Coba 1: Kamera belakang (buat HP)
  try{
    await html5QrcodeScanner.start({facingMode:{exact:"environment"}}, config, onScanSuccess, ()=>{});
    document.getElementById('status').innerText="✅ Kamera belakang aktif";
    setTimeout(()=>setZoom(2.5),600);
    return;
  }catch(e){}

  // Coba 2: Kamera belakang biasa
  try{
    await html5QrcodeScanner.start({facingMode:"environment"}, config, onScanSuccess, ()=>{});
    document.getElementById('status').innerText="✅ Kamera belakang aktif";
    setTimeout(()=>setZoom(2.5),600);
    return;
  }catch(e){}

  // Coba 3: Kamera depan (buat LAPTOP )
  try{
    await html5QrcodeScanner.start({facingMode:"user"}, config, onScanSuccess, ()=>{});
    document.getElementById('status').innerText="✅ Kamera depan aktif (mode Laptop)";
    return;
  }catch(e){}

  // Coba 4: Ambil kamera apa aja yang ada
  try{
    let cams = await Html5Qrcode.getCameras();
    if(cams && cams.length){
    
      await html5QrcodeScanner.start(cams[0].id, config, onScanSuccess, ()=>{});
      document.getElementById('status').innerText="✅ Kamera aktif: "+cams[0].label;
      return;
    }
  }catch(e){}

  document.getElementById('status').innerText="❌ Kamera diblokir - cek izin kamera di Chrome";
}
function setZoom(z){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.zoom){track.applyConstraints({advanced:[{zoom:Math.min(z,cap.zoom.max)}]})}}catch(e){}}
function paksaFokus(){try{const track=html5QrcodeScanner.getRunningTrack();track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch{html5QrcodeScanner.stop().then(()=>startCam())}}
function toggleTorch(){try{const track=html5QrcodeScanner.getRunningTrack();const cap=track.getCapabilities();if(cap.torch){torchOn=!torchOn;track.applyConstraints({advanced:[{torch:torchOn}]})}}catch(e){}}
async function gantiKamera(){try{await html5QrcodeScanner.stop()}catch{}startCam()}
async function autoSave(){
  
  let bagian=localStorage.getItem('bagian')||TYPE;
  const wib=getWIBDateTime();
  let tgl_input=wib.tgl_id; 
  
  try{
    let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
    
    if(TYPE=='BALL'){
      listBak.forEach(qr=>{
        if(!qr) return;
        let idx=all.findIndex(d=>d.QR_BAK==qr);
        if(idx==-1){
          all.push({QR_BAK:qr,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,waktu:wib.full_display,TGL_JAM_CLIENT:wib.full_display,status:'Lokal'});
        } else {
          all[idx].ID_BALL=res['ID BALL']||''; all[idx].NO_BOX=res['NO BOX']||'';
        }
      });
    } else {
      let qr=res['QR CODE BAK']||'';
      let idx=all.findIndex(d=>d.QR_BAK==qr && !d.ID_BALL);
      if(idx==-1){
        all.push({QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:TYPE=='KMS'?res['ID KMS']||'':'',ID_PACK:TYPE=='PACK'?res['ID PACK']||'':'',ID_BDL:TYPE=='BDL'?res['ID BDL']||'':'',BAGIAN:bagian,TANGGAL:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,waktu:wib.full_display,TGL_JAM_CLIENT:wib.full_display,status:'Lokal'});
      } else {
        if(TYPE=='KMS') all[idx].ID_KMS=res['ID KMS']||'';
        if(TYPE=='PACK') all[idx].ID_PACK=res['ID PACK']||'';
        if(TYPE=='BDL') all[idx].ID_BDL=res['ID BDL']||'';
        all[idx].status='Lokal';
      }
    }
    
    // SIMPAN DULU KE RIWAYAT -UNTUK OFFLINE
    localStorage.setItem('riwayat',JSON.stringify(all));
    localStorage.setItem('riwayat_scan',JSON.stringify(all));
    console.log("✅ RIWAYAT TERSIMPAN OFFLINE", all.length);
  }catch(err){
    alert("Gagal simpen riwayat: "+err);
    return;
  }

  // BARU STOP KAMERA
  if(html5QrcodeScanner){try{await html5QrcodeScanner.stop()}catch(e){}}

  // BARU COBA KIRIM KE SHEET
 let kirim;
if(TYPE=='BALL'){
  kirim={TYPE:'BALL_8',LIST_BAK:listBak,ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TGL_KMS:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,TGL_JAM_CLIENT:wib.full_display,TGL_ISO:wib.iso,JAM_MILIS:wib.milis};
} else {
  kirim={QR_BAK:res['QR CODE BAK']||'',ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:res['ID KMS']||'',ID_PACK:res['ID PACK']||'',ID_BDL:res['ID BDL']||'',BAGIAN:bagian,TGL_KMS:tgl_input,TGL_CLIENT:wib.tgl_id,JAM_CLIENT:wib.jam,TGL_JAM_CLIENT:wib.full_display,TGL_ISO:wib.iso,JAM_MILIS:wib.milis,TYPE:TYPE};
}
  document.getElementById('status').innerText="⏳ KIRIM... "+wib.full_display;
  try{
    await fetch(GOOGLE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(kirim)});
    document.getElementById('status').innerText="✅ TERKIRIM "+wib.full_display;
  }catch(e){
    document.getElementById('status').innerText="⚠️ OFFLINE - RIWAYAT AMAN "+wib.full_display;
  }

  setTimeout(()=>{alert('✅ Tersimpan! (Offline aman)\nJam: '+wib.full_display+'\nCek di Riwayat ya');location.href='index.html';},600);
}
  function updateJamLive(){const wib=getWIBDateTime();const el=document.getElementById('jamLive');if(el)el.innerText=wib.tgl_id+' '+wib.jam+' WIB'}
setInterval(updateJamLive,1000);updateJamLive();
renderSteps();startCam();
</script>
</body>
</html>
