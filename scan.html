<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PT URIP SUGIARTO</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>
<style>
body{
  margin:0;background:#0a0a0a;color:#ffd700;font-family:sans-serif;
  padding:12px;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;width:100%;box-sizing:border-box;overflow-x:hidden;
}
.header{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#1a1a1a,#000);
  border:2px solid #c9a84c;border-radius:12px;padding:10px;
  width:100%;max-width:500px;box-sizing:border-box;
}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{
  background:#111;border:2px solid #c9a84c;border-radius:12px;
  padding:12px;margin-top:12px;width:100%;max-width:400px;
  display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
}
.step{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;border:1px solid #444}
.active{background:gold;color:black}.done{background:#0f0;color:black}.wait{background:#222;color:#888}
#reader{
  width:280px !important;min-width:280px !important;max-width:280px !important;
  height:280px !important;min-height:280px !important;max-height:280px !important;
  margin:12px auto !important;position:relative !important;display:block !important;
  background:#000;border-radius:12px;border:2px solid #c9a84c;overflow:hidden !important;
}
#reader *{box-sizing:border-box !important;max-width:280px !important}
#reader > div{width:280px !important;height:280px !important;margin:0 auto !important;left:0 !important;right:0 !important}
#reader video{width:280px !important;height:280px !important;object-fit:cover !important;left:0 !important;transform:none !important}

#scan-guide{border:4px solid #ffeb00;box-shadow:0 0 0 4000px rgba(0,0,0,0.45);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;z-index:5;pointer-events:none}
#scan-guide::before{content:'ARAHKAN QR KESINI';position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:#ffeb00;color:#000;font-weight:900;padding:2px 10px;white-space:nowrap;font-size:11px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;box-sizing:border-box}
input{width:100%;max-width:400px;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;box-sizing:border-box;margin-top:8px}
#resultBox,#verify8Box{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;padding:20px;box-sizing:border-box;overflow:auto}
.card{background:#1a1a1a;border:3px solid gold;border-radius:16px;padding:20px;text-align:center;margin-top:10%}
#list-preview{background:#000;border:1.5px solid #0f0;border-radius:8px;padding:8px;margin-top:8px;max-height:180px;overflow:auto;text-align:left;font-size:13px;color:#0f0;width:100%;box-sizing:border-box}
</style>
</head>
<body>
<div class="header"><div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIP SUGIARTO - ANTI MLONGO</div></div>
<div id="emergencyBox" style="display:none;background:#ff0000;border:3px solid yellow;border-radius:12px;padding:12px;margin-top:12px;width:100%;max-width:500px;box-sizing:border-box">
<div style="color:yellow;font-weight:900;text-align:center">⚠️ ADA <span id="offlineCount">0</span> DATA PAGI NYANGKUT DI HP INI</div>
<button onclick="KIRIM_RIWAYAT_PAGI()" class="btn" style="background:#ffff00;color:#000;font-size:20px;padding:20px">🚨 KLIK KIRIM ULANG 400 DATA PAGI</button>
<div id="kirimProgress" style="color:white;text-align:center;margin-top:8px;font-weight:700"></div>
</div>

<div class="box">
<div style="font-weight:900;color:#ffdf8a;text-align:center;width:100%" id="tipe">SCAN</div>
<div id="steps" style="margin-top:8px;text-align:center;width:100%"></div>
<div id="step-info" style="text-align:center;margin-top:8px;font-weight:900;color:gold;width:100%">Siap Scan</div>
<div id="reader"><div id="scan-guide"></div></div>
<div id="list-preview" style="width:100%"><div style="color:#888">Belum ada QR BAK - Scan 8x</div></div>
<button onclick="paksaFokus()" class="btn" style="background:#2563eb;color:white">🔍 TAP JIKA BLUR</button>
<div style="display:flex;gap:6px;width:100%">
<button onclick="setZoom(1)" class="btn" style="background:#333;color:white;flex:1">1x</button>
<button onclick="setZoom(2.5)" class="btn" style="background:gold;color:black;flex:1">2.5x</button>
<button onclick="toggleTorch()" class="btn" style="background:#333;color:white;flex:1">🔦</button>
<button onclick="gantiKamera()" class="btn" style="background:#0d2a54;color:white;flex:1;border:2px solid #2a5aa8">🔄</button>
</div>
<input id="manual" placeholder="Ketik manual jika QR rusak" autocomplete="off" autocapitalize="characters" spellcheck="false" style="margin-top:12px">
<button onclick="inputManual()" class="btn" style="background:#333;color:white">INPUT MANUAL</button>
<div id="status" style="text-align:center;margin-top:10px;color:#0f0;font-weight:900;width:100%"></div>
<div id="bdlCounter" style="display:none;text-align:center;margin-top:8px;background:#ffeb00;color:#000;font-weight:900;padding:8px;border-radius:8px;width:100%"></div>
<button onclick="resetScan()" class="btn" style="background:#222;color:white">🔄 ULANG SEMUA</button>
<button onclick="location.href='index.html'" class="btn" style="background:#b91c1c;color:white;border:2px solid gold">⬅ KEMBALI</button>
</div>

<div id="resultBox"><div class="card"><div id="resStep" style="color:gold;font-weight:900;font-size:14px"></div><h2 style="color:white;margin:8px 0">Hasil Scan:</h2><h1 id="resValue" style="color:#0f0;word-break:break-all;font-size:22px;background:#000;padding:14px;border-radius:8px;border:1px solid #444"></h1><div id="extraInfo" style="color:#ffeb00;margin-top:10px;font-weight:700"></div><div style="display:flex;gap:10px;margin-top:18px"><button onclick="confirmScan()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI</button><button onclick="ulangCurrent()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG</button></div></div></div>
<div id="verify8Box"><div class="card" style="border-color:#0f0"><h2 style="color:#0f0">✅ 8 QR TERKUMPUL</h2><div id="list8Preview" style="background:#000;border:1px solid #444;border-radius:8px;padding:8px;max-height:260px;overflow:auto;text-align:left;font-size:13px;color:#0f0;margin-top:10px"></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="confirm8()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI LANJUT</button><button onclick="ulang8()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 ULANG 8 QR</button></div></div></div>
<script>

const GOOGLE_URL="https://script.google.com/macros/s/AKfycbyh3iNQV_kjmj5Xougv71g7gxf9K16OMxdhsVVhifOXcR5PRKSP670k3Bq--Oz05UF7Sw/exec";
const TYPE=(localStorage.getItem('scan_type')||'BALL').toUpperCase();
document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],'KMS':['QR CODE BAK','ID KMS'],'PACK':['QR CODE BAK','ID PACK'],'BDL':['QR CODE BAK','ID BDL'],'BALL':['QR CODE BAK','ID BALL','NO BOX']};
let flow=FLOWS[TYPE]||FLOWS['BALL']; let cur=0; let res={}; let listBak=[]; let html5QrcodeScanner; let lastScanTime=0; let isPause=false; let tempScan=""; let torchOn=false; let currentCam=0; let cams=[];

// ===== AUTO HAPUS RIWAYAT HP 1 MINGGU SEKALI - BARU MIN =====
function autoHapusRiwayatHP_Mingguan(){
  try{
    let all = JSON.parse(localStorage.getItem('riwayat')||'[]');
    if(all.length==0) return;
    let now = new Date(); let batas = new Date(); batas.setDate(now.getDate() - 7);
    let awal = all.length;
    let sisa = all.filter(d=>{
      try{
        let tglStr = d.waktu || d.TGL_JAM_CLIENT || d.TANGGAL || d.TGL_CLIENT || "";
        let tgl = new Date(tglStr);
        if(isNaN(tgl.getTime())){
          // coba parse manual id-ID 29/10/2026
          let p = tglStr.split(/[\s,]+/)[0].split('/');
          if(p.length==3) tgl = new Date(p[2], p[1]-1, p[0]);
          else return true;
        }
        return tgl >= batas;
      }catch(e){ return true; }
    });
    let kehapus = awal - sisa.length;
    if(kehapus > 0){
      localStorage.setItem('riwayat', JSON.stringify(sisa));
      localStorage.setItem('riwayat_scan', JSON.stringify(sisa));
      document.getElementById('status').innerHTML = `<div style="background:#ffeb00;color:#000;padding:8px;border-radius:8px">🧹 Auto hapus: ${kehapus} data >7 hari dibersihkan</div>`;
      setTimeout(()=>{ document.getElementById('status').innerText='Siap Scan'; },3000);
    }
    localStorage.setItem('last_clean_hp', Date.now());
  }catch(e){ console.log(e); }
}

function renderSteps(){
 let h='';
 if(TYPE=='BALL'){
   if(cur==0) h+=`<span class="step active">▶ QR BAK [${listBak.length}/8]</span>`;
   else h+=`<span class="step done">✓ QR BAK [8/8]</span>`;
   flow.slice(1).forEach((s,i)=>{let stepIdx=i+1;let cls=stepIdx<cur?'done':stepIdx==cur?'active':'wait';h+=`<span class="step ${cls}">${stepIdx<cur?'✓ ':stepIdx==cur?'▶ ':''}${s}</span>`;});
   document.getElementById('step-info').innerText = cur==0 ? `Siap Scan [${listBak.length}/8]` : flow[cur];
   document.getElementById('list-preview').style.display='block';
 } else { 
   flow.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'wait';h+=`<span class="step ${cls}">${i<cur?'✓ ':i==cur?'▶ ':''}${s}</span>`;});
   document.getElementById('step-info').innerText = flow[cur] || 'Siap Scan';
   document.getElementById('list-preview').style.display='none';
 }
 document.getElementById('steps').innerHTML=h;
}
function getWIBDateTime(){
  const now=new Date();
  return{
  tgl_client:now.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),
  tgl_client_id:now.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'}),
  jam_client:now.toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour12:false}),
  full_client:now.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'})+' '+now.toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour12:false}),
  raw:now};
}
function cekOffline(){
  try{
    let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
    let offline=all.filter(d=>d.status=='Lokal').length;
    if(offline>0){
      document.getElementById('emergencyBox').style.display='block';
      document.getElementById('offlineCount').innerText=offline;
    } else {
      document.getElementById('emergencyBox').style.display='none';
    }
  }catch(e){}
}
async function KIRIM_RIWAYAT_PAGI(){
  let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
  let toSend=all.filter(d=>d.status=='Lokal');
  if(toSend.length==0){ alert("Gak ada data nyangkut"); return; }
  if(!confirm("Kirim "+toSend.length+" data?")) return;
  document.getElementById('kirimProgress').innerText="⏳ Mengirim 0/"+toSend.length+"...";
  let sukses=0;
  for(let i=0;i<toSend.length;i++){
    let d=toSend[i];
    let payload={QR_BAK:d.QR_BAK,ID_PC:d.ID_PC||'',ID_GL:d.ID_GL||'',ID_GL2:d.ID_GL2||'',ID_KMS:d.ID_KMS||'',ID_PACK:d.ID_PACK||'',ID_BDL:d.ID_BDL||'',ID_BALL:d.ID_BALL||'',NO_BOX:d.NO_BOX||'',BAGIAN:d.BAGIAN||TYPE,TGL_KMS:d.TANGGAL,TGL_CLIENT:d.TGL_CLIENT,JAM_CLIENT:d.JAM_CLIENT,TGL_JAM_CLIENT:d.waktu||d.TGL_JAM_CLIENT,TYPE:d.ID_BALL?'BALL':TYPE};
    try{
      await fetch(GOOGLE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),mode:'no-cors'});
      sukses++;
      document.getElementById('kirimProgress').innerText=`⏳ Mengirim ${sukses}/${toSend.length}...`;
      await new Promise(r=>setTimeout(r,300));
    }catch(e){}
  }
  all.forEach(d=>{ if(d.status=='Lokal') d.status='Terkirim Ulang Pagi'; });
  localStorage.setItem('riwayat',JSON.stringify(all));
  localStorage.setItem('riwayat_scan',JSON.stringify(all));
  document.getElementById('kirimProgress').innerText=`✅ BERES! ${sukses} DATA MASUK!`;
  alert(`BERES! ${sukses} data udah masuk!`);
  cekOffline();
}
function hitungBDL(idBdl){
  if(!idBdl) return 0;
  try{
    let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
    let todayID = new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta'});
    let todayEN = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
    return all.filter(d=>{
      let waktu = (d.waktu||'') + ' ' + (d.TGL_CLIENT||'') + ' ' + (d.TANGGAL||'');
      let isHariIni = waktu.includes(todayID) || waktu.includes(todayEN);
      return isHariIni && (d.ID_BDL||'').toUpperCase()==idBdl.toUpperCase();
    }).length;
  }catch(e){return 0;}
}
function validatePager(value, step){
  step = step.toUpperCase();
  value = value.trim();

  // 1. QR BAK harus format BAK-001 / G1-001
  if(step.includes('QR CODE BAK') || step.includes('QR BAK')){
    if(!/^[A-Z0-9]+-[0-9]+$/i.test(value)){
      return "BUKAN QR BAK! Harusnya BAK-001";
    }
  }
  
  // 2. YANG 6 ANGKA: PC, GL 1, GL 2, KMS, PACK, BDL
  if(step.includes('ID PC') || step.includes('ID GL') || step.includes('ID KMS') || step.includes('ID PACK') || step.includes('ID BDL')){
    if(!/^\d{6}$/.test(value)){
      return "BUKAN ID 6 ANGKA! Harusnya 6 ANGKA misal 123456";
    }
  }

  // 3. ID BALL = NAMA,  gak usah di cek, bebas
  // NO BOX  bebas

  return "";
}
function onScanSuccess(decoded){
 if(isPause) return;
 const now=Date.now(); if(now-lastScanTime<800) return; lastScanTime=now;
 decoded = decoded.trim().toUpperCase();
 let stepSekarang = "";
 if(TYPE=='BALL' && cur==0) stepSekarang = "QR CODE BAK";
 else stepSekarang = flow[cur] || "";
 let cekSalah = validatePager(decoded, stepSekarang);
 if(cekSalah){
   let guide = document.getElementById('scan-guide');
   guide.style.borderColor = "#ff0000";
   guide.style.boxShadow = "0 0 0 4000px rgba(255,0,0,0.6)";
   document.getElementById('status').innerHTML = `<div style="background:#ff0000;color:white;padding:15px;border-radius:12px;border:3px solid yellow;text-align:center"><div style="font-size:20px;font-weight:900">⛔ SALAH! ${cekSalah}<br><small style="font-size:14px">Kamu scan: ${decoded}</small></div><div style="margin-top:10px;background:yellow;color:black;padding:10px;border-radius:8px;font-size:18px;font-weight:900;animation:blink 0.8s infinite">👉 SCAN ULANG SING BENER! JANGAN MLONGO!</div><button onclick="resetError()" style="margin-top:10px;width:100%;padding:12px;background:white;color:red;font-weight:900;border-radius:8px;border:none">🔄 OKE, SCAN LAGI</button></div>`;
   if('speechSynthesis' in window){
     try{speechSynthesis.cancel();let ucap = new SpeechSynthesisUtterance(cekSalah + ". Scan ulang yang benar!");ucap.lang = 'id-ID'; ucap.rate = 1.1; speechSynthesis.speak(ucap);}catch(e){}
   }
   if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
   setTimeout(()=>{ resetError(); }, 3500);
   return;
 }
 if(TYPE=='BALL' && cur==0){
   if(listBak.includes(decoded)){document.getElementById('status').innerText='⚠️ QR udah ada!'; if(navigator.vibrate) navigator.vibrate([100,50,100]); return;}
   listBak.push(decoded);
   document.getElementById('list-preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');
   renderSteps(); if(navigator.vibrate) navigator.vibrate([80]);
   document.getElementById('status').innerText=`✅ Masuk ${listBak.length}/8`;
   if(listBak.length < 8) return;
   document.getElementById('list8Preview').innerHTML=listBak.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('');
   document.getElementById('verify8Box').style.display='block';
   isPause=true; try{html5QrcodeScanner.pause(true);}catch(e){}
   return;
 }
 isPause=true; tempScan=decoded; try{html5QrcodeScanner.pause(true);}catch(e){}
 document.getElementById('resStep').innerText=flow[cur];
 document.getElementById('resValue').innerText=decoded;
 document.getElementById('extraInfo').innerText='';
 if(TYPE=='BDL' && flow[cur]=='ID BDL'){
   let c=hitungBDL(decoded)+1;
   document.getElementById('extraInfo').innerText=`🔢 ID BDL ini sudah scan ${c}x (termasuk yang ini)`;
   document.getElementById('bdlCounter').style.display='block';
   document.getElementById('bdlCounter').innerText=`🔢 BDL ${decoded} = ${c}x scan hari ini`;
 }
 document.getElementById('resultBox').style.display='block'; if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function resetError(){
  let guide = document.getElementById('scan-guide');
  if(guide){ guide.style.borderColor = "#ffeb00"; guide.style.boxShadow = "0 0 0 4000px rgba(0,0,0,0.45)"; }
  document.getElementById('status').innerHTML = "Siap Scan Ulang Yang Benar...";
  try{html5QrcodeScanner.resume();}catch(e){}
  isPause=false; lastScanTime=0;
}
function confirm8(){ document.getElementById('verify8Box').style.display='none'; cur=1; renderSteps(); document.getElementById('status').innerText='8 BAK OK! Scan ID BALL'; if(navigator.vibrate) navigator.vibrate([200,100,200]); isPause=false; try{html5QrcodeScanner.resume();}catch(e){} lastScanTime=Date.now(); }
function ulang8(){ document.getElementById('verify8Box').style.display='none'; listBak=[]; document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x ya </div>'; renderSteps(); document.getElementById('status').innerText='🔄 Ulang 8 QR ya'; isPause=false; try{html5QrcodeScanner.resume();}catch(e){} }
function confirmScan(){
  document.getElementById('resultBox').style.display='none';
  if(TYPE=='BALL' && cur==0){} else {
    if(cur==0) res.QR_BAK = tempScan;
    else if(flow[cur].includes('BALL')) res.ID_BALL = tempScan;
    else if(flow[cur].includes('BOX')) res.NO_BOX = tempScan;
    else if(flow[cur].includes('PC')) res.ID_PC = tempScan;
    else if(flow[cur].includes('GL 1')) res.ID_GL = tempScan;
    else if(flow[cur].includes('GL 2')) res.ID_GL2 = tempScan;
    else if(flow[cur].includes('KMS')) res.ID_KMS = tempScan;
    else if(flow[cur].includes('PACK')) res.ID_PACK = tempScan;
    else if(flow[cur].includes('BDL')) res.ID_BDL = tempScan;
  }
  if(TYPE=='BALL' && cur==0){ cur=1; } else { cur++; }
  if(cur >= flow.length){
    kirimData();
  } else {
    renderSteps(); isPause=false; try{html5QrcodeScanner.resume();}catch(e){} lastScanTime=Date.now();
    document.getElementById('status').innerText='Scan '+flow[cur];
  }
}
function ulangCurrent(){
  document.getElementById('resultBox').style.display='none';
  isPause=false; try{html5QrcodeScanner.resume();}catch(e){} lastScanTime=Date.now();
}
function inputManual(){
  let v=document.getElementById('manual').value.trim().toUpperCase();
  if(!v){ alert("Isi dulu manualnya"); return; }
  document.getElementById('manual').value='';
  onScanSuccess(v);
}
  document.getElementById('manual').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    inputManual();
  }
});
function resetScan(){
  cur=0; res={}; listBak=[]; tempScan='';
  document.getElementById('list-preview').innerHTML='<div style="color:#888">Belum ada QR BAK - Scan 8x</div>';
  document.getElementById('bdlCounter').style.display='none';
  renderSteps(); document.getElementById('status').innerText='🔄 Ulang Semua';
  isPause=false; try{html5QrcodeScanner.resume();}catch(e){}
}
function paksaFokus(){ try{html5QrcodeScanner.resume();}catch(e){} document.getElementById('status').innerText='🔍 Fokus...'; }
function setZoom(z){ try{ html5QrcodeScanner.applyVideoConstraints({advanced:[{zoom:z}]}); }catch(e){} }
function toggleTorch(){ torchOn=!torchOn; try{ html5QrcodeScanner.applyVideoConstraints({advanced:[{torch:torchOn}]}); }catch(e){} }
async function gantiKamera(){
  if(cams.length==0){ try{ cams=await Html5Qrcode.getCameras(); }catch(e){} }
  if(cams.length>1){ currentCam=(currentCam+1)%cams.length; startCam(cams[currentCam].id); }
}
async function kirimData(){
  const wib=getWIBDateTime();
  let payload={};
  if(TYPE=='BALL'){
    payload={QR_BAK:listBak.join(','),ID_BALL:res.ID_BALL||'',NO_BOX:res.NO_BOX||'',BAGIAN:TYPE,TGL_KMS:wib.full_client,TGL_CLIENT:wib.tgl_client,JAM_CLIENT:wib.jam_client,TGL_JAM_CLIENT:wib.full_client,TYPE:'BALL'};
  } else {
    payload={QR_BAK:res.QR_BAK||'',ID_PC:res.ID_PC||'',ID_GL:res.ID_GL||'',ID_GL2:res.ID_GL2||'',ID_KMS:res.ID_KMS||'',ID_PACK:res.ID_PACK||'',ID_BDL:res.ID_BDL||'',ID_BALL:res.ID_BALL||'',NO_BOX:res.NO_BOX||'',BAGIAN:TYPE,TGL_KMS:wib.full_client,TGL_CLIENT:wib.tgl_client,JAM_CLIENT:wib.jam_client,TGL_JAM_CLIENT:wib.full_client,TYPE:TYPE};
  }
  // SIMPAN KE RIWAYAT HP
  try{
    let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
    all.push({QR_BAK:payload.QR_BAK,ID_PC:payload.ID_PC,ID_GL:payload.ID_GL,ID_GL2:payload.ID_GL2,ID_KMS:payload.ID_KMS,ID_PACK:payload.ID_PACK,ID_BDL:payload.ID_BDL,ID_BALL:payload.ID_BALL,NO_BOX:payload.NO_BOX,BAGIAN:TYPE,TANGGAL:wib.full_client,TGL_CLIENT:wib.tgl_client,JAM_CLIENT:wib.jam_client,waktu:wib.full_client,status:'Lokal',TGL_JAM_CLIENT:wib.full_client});
    localStorage.setItem('riwayat', JSON.stringify(all));
    localStorage.setItem('riwayat_scan', JSON.stringify(all));
  }catch(e){}
  document.getElementById('status').innerText='⏳ Kirim...';
  try{
    await fetch(GOOGLE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),mode:'no-cors'});
    document.getElementById('status').innerText='✅ Terkirim!';
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    // UPDATE STATUS JADI TERKIRIM
    try{
      let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
      if(all.length>0) all[all.length-1].status='Terkirim';
      localStorage.setItem('riwayat', JSON.stringify(all));
      localStorage.setItem('riwayat_scan', JSON.stringify(all)); 
  }
    catch(e){
    document.getElementById('status').innerText='📱 Disimpen Lokal (Offline)';
  }
  setTimeout(()=>{ resetScan(); },1200);
}
async function startCam(camId){
  if(html5QrcodeScanner){ 
    try{ await html5QrcodeScanner.stop(); }catch(e){}
    try{ await html5QrcodeScanner.clear(); }catch(e){}
  }
  html5QrcodeScanner = new Html5Qrcode("reader", { verbose: false });
  
  // CONFIG ANTI GELAP
  let config = {
    fps: 10,
    qrbox: { width: 250, height: 250 },
    aspectRatio: 1.0
  };

  // CAMERA ID - JANGAN PAKE videoConstraints DIDALEM CONFIG
  let cameraConfig;
  if(camId){
    cameraConfig = { deviceId: { exact: camId } };
  } else {
    cameraConfig = { facingMode: "environment" }; // JANGAN PAKE exact, JANGAN PAKE videoConstraints
  }

  try{
    await html5QrcodeScanner.start(cameraConfig, config, onScanSuccess, ()=>{});
    document.getElementById('status').innerText = '✅ Kamera nyala';
    cams = await Html5Qrcode.getCameras();
  }catch(e){ 
    console.log(e);
    // FALLBACK - COBA TANPA DEVICE ID
    try{
      await html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess, ()=>{});
    }catch(e2){
      document.getElementById('status').innerText = '❌ Kamera error: ' + e2;
    }
  }
}
(async()=>{
  renderSteps();
  // CEK AUTO HAPUS MINGGUAN
  let lastClean = parseInt(localStorage.getItem('last_clean_hp')||0);
  let seminggu = 7 * 24 * 60 * 60 * 1000;
  if(Date.now() - lastClean > seminggu){
    autoHapusRiwayatHP_Mingguan();
  }
  cekOffline();
  startCam();
})();
